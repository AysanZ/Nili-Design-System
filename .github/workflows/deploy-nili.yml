name: Deploy nili.aysanz.dev

# Separate from the existing ci.yml / deploy.yml pair (which build and
# publish the library itself, and a since-superseded Storybook container on a
# different host). This workflow only concerns apps/www.
on:
  push:
    branches: [main]
    paths:
      # Anything the image's traced import graph can reach. `src/**` and
      # `registry/**` because apps/www imports @nili/ui straight from source
      # (see next.config.ts and apps/www/Dockerfile's header comment) — a
      # component change with no apps/www edit at all still has to rebuild
      # this image, or the deployed site drifts from the library.
      - 'apps/www/**'
      - 'src/**'
      - 'registry/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/nili/**'
      - '.github/workflows/deploy-nili.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-nili-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Created by this repository's GITHUB_TOKEN, so package access is inherited.
  IMAGE: ghcr.io/aysanz/nili-design-system

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment rollback behavior
        run: python3 -B -m unittest discover -s deploy/nili -p 'test_*.py'

      - name: Short SHA
        id: tag
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build context is the repository root, not apps/www — see the
      # Dockerfile's own header comment for why: @nili/ui resolves to root
      # source, and a context scoped to apps/www would never see it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/www/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://nili.aysanz.dev
    steps:
      - name: Check deployment credentials
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          for name in SSH_HOST SSH_USER SSH_KEY SSH_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production secret: $name"
              exit 1
            fi
          done

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE }}
          DEPLOY_TAG: ${{ needs.build-and-push.outputs.tag }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_IMAGE,DEPLOY_TAG,DEPLOY_REVISION,DEPLOY_REPOSITORY,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            release_dir=$(mktemp -d /tmp/nili-release.XXXXXX)
            trap 'rm -rf "$release_dir"' EXIT
            source_url="https://raw.githubusercontent.com/$DEPLOY_REPOSITORY/$DEPLOY_REVISION/deploy/nili"
            curl -fsSL --retry 3 "$source_url/deploy.sh" -o "$release_dir/deploy.sh"
            curl -fsSL --retry 3 "$source_url/docker-compose.prod.yml" -o "$release_dir/docker-compose.prod.yml"
            bash "$release_dir/deploy.sh" "$release_dir/docker-compose.prod.yml"

      - name: Verify public site
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors --max-time 15 https://nili.aysanz.dev/en -o /dev/null
